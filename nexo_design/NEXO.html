<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO — App Móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0d0d14;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
  }
  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  /* Ambient glow behind phone */
  .scene {
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .scene::before {
    content: '';
    position: absolute;
    width: 420px; height: 420px;
    background: radial-gradient(ellipse,
      rgba(62, 207, 110, 0.12) 0%,
      rgba(77, 158, 255, 0.08) 35%,
      transparent 70%
    );
    border-radius: 50%;
    filter: blur(40px);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="scene" id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── COLOR SYSTEM ─────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentGreen":  "#3ecf6e",
  "accentBlue":   "#4d9eff",
  "accentYellow": "#f5d547",
  "accentRed":    "#f05a40",
  "bgColor":      "#0a0a0f",
  "fontDisplay":  "Outfit",
  "roundness":    "18"
}/*EDITMODE-END*/;

/* ─── PUZZLE DATA ───────────────────────────────────────── */
const PUZZLE = {
  groups: [
    {
      id: 0, label: "🟩 VERDE",
      theme: "Capitales de América del Sur",
      color: "green",
      words: ["LIMA", "BOGOTÁ", "QUITO", "CARACAS"]
    },
    {
      id: 1, label: "🟦 AZUL",
      theme: "Planetas del Sistema Solar",
      color: "blue",
      words: ["MARTE", "VENUS", "SATURNO", "JÚPITER"]
    },
    {
      id: 2, label: "🟨 AMARILLO",
      theme: "Obras de Cervantes",
      color: "yellow",
      words: ["QUIJOTE", "NOVELAS", "GALATEA", "PERSILES"]
    },
    {
      id: 3, label: "🟥 ROJO",
      theme: "Instrumentos de cuerda",
      color: "red",
      words: ["VIOLÍN", "ARPA", "LAÚD", "CÍTARA"]
    }
  ]
};

/* shuffle deterministically for display */
const ALL_WORDS = [
  "LIMA","MARTE","QUIJOTE","VIOLÍN",
  "BOGOTÁ","VENUS","NOVELAS","ARPA",
  "QUITO","SATURNO","GALATEA","LAÚD",
  "CARACAS","JÚPITER","PERSILES","CÍTARA"
];

/* ─── UTILS ─────────────────────────────────────────────── */
function getGroupColor(groupId, tweak) {
  const map = { green: tweak.accentGreen, blue: tweak.accentBlue, yellow: tweak.accentYellow, red: tweak.accentRed };
  const colStr = PUZZLE.groups[groupId]?.color;
  return map[colStr] || tweak.accentGreen;
}
function getWordGroup(word) {
  return PUZZLE.groups.find(g => g.words.includes(word));
}

/* ─── SCREENS ───────────────────────────────────────────── */

/* HOME SCREEN */
function HomeScreen({ onPlay, onHowTo, tweak }) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => { setTimeout(() => setMounted(true), 60); }, []);

  const letters = ['N','E','X','O'];
  const colors = [tweak.accentGreen, tweak.accentBlue, tweak.accentYellow, tweak.accentRed];

  return (
    <div style={{
      width:'100%', height:'100%',
      background: tweak.bgColor,
      display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'space-between',
      padding:'0 0 36px 0',
      overflow:'hidden',
      position:'relative',
    }}>
      {/* Radial ambient */}
      <div style={{
        position:'absolute', top:'-60px', left:'50%',
        transform:'translateX(-50%)',
        width:'340px', height:'340px',
        background:`radial-gradient(ellipse, ${tweak.accentBlue}33 0%, ${tweak.accentGreen}18 40%, transparent 70%)`,
        filter:'blur(32px)',
        pointerEvents:'none',
      }} />

      {/* Top section */}
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'0px', paddingTop:'64px', flex:1, justifyContent:'center' }}>

        {/* Decorative top bar */}
        <div style={{
          display:'flex', gap:'6px', marginBottom:'28px',
          opacity: mounted ? 1 : 0,
          transform: mounted ? 'translateY(0)' : 'translateY(-12px)',
          transition:'all 0.6s cubic-bezier(0.34,1.56,0.64,1)',
        }}>
          {colors.map((c,i) => (
            <div key={i} style={{
              width:'28px', height:'4px',
              background: c,
              borderRadius:'4px',
              boxShadow: `0 0 8px ${c}`,
            }}/>
          ))}
        </div>

        {/* NEXO Logo — letter-by-letter */}
        <div style={{ display:'flex', gap:'2px', marginBottom:'6px' }}>
          {letters.map((l,i) => (
            <div key={l} style={{
              fontSize:'88px',
              fontWeight:'900',
              fontFamily: tweak.fontDisplay + ', Outfit, sans-serif',
              color: colors[i],
              lineHeight:1,
              letterSpacing:'-2px',
              textShadow: `0 0 40px ${colors[i]}88, 0 0 80px ${colors[i]}44`,
              opacity: mounted ? 1 : 0,
              transform: mounted ? 'translateY(0) scale(1)' : 'translateY(20px) scale(0.9)',
              transition: `all 0.7s cubic-bezier(0.34,1.56,0.64,1) ${i*0.08}s`,
            }}>{l}</div>
          ))}
        </div>

        {/* Tagline */}
        <div style={{
          textAlign:'center',
          padding:'0 24px',
          opacity: mounted ? 1 : 0,
          transform: mounted ? 'translateY(0)' : 'translateY(10px)',
          transition:'all 0.7s ease 0.4s',
        }}>
          <p style={{
            fontSize:'14px',
            fontFamily:'DM Sans, sans-serif',
            fontWeight:'300',
            color:'oklch(0.75 0.01 240)',
            letterSpacing:'0.04em',
            lineHeight:'1.5',
          }}>
            Conecta los conceptos.<br />
            <span style={{ fontStyle:'italic', color:'oklch(0.85 0.01 240)' }}>Desafía tu mente.</span>
          </p>
        </div>

        {/* 4-color grid preview */}
        <div style={{
          display:'grid',
          gridTemplateColumns:'repeat(4, 1fr)',
          gap:'5px',
          marginTop:'32px',
          width:'220px',
          opacity: mounted ? 1 : 0,
          transform: mounted ? 'translateY(0)' : 'translateY(12px)',
          transition:'all 0.7s ease 0.5s',
        }}>
          {[0,1,2,3].map(row =>
            [0,1,2,3].map(col => {
              const isActive = col === row;
              return (
                <div key={`${row}-${col}`} style={{
                  height:'16px',
                  borderRadius:'4px',
                  background: isActive ? colors[row] : `${colors[row]}28`,
                  boxShadow: isActive ? `0 0 6px ${colors[row]}88` : 'none',
                  transition:'all 0.3s ease',
                }} />
              );
            })
          )}
        </div>

        {/* Stats row */}
        <div style={{
          display:'flex', gap:'24px', marginTop:'28px',
          opacity: mounted ? 1 : 0,
          transition:'all 0.7s ease 0.6s',
        }}>
          {[['12K+','Jugadores'],['500+','Puzzles'],['4','Niveles']].map(([val,lbl]) => (
            <div key={lbl} style={{ textAlign:'center' }}>
              <div style={{ fontSize:'18px', fontWeight:'700', color:'white', lineHeight:1 }}>{val}</div>
              <div style={{ fontSize:'10px', color:'oklch(0.55 0.01 240)', fontFamily:'DM Sans,sans-serif', marginTop:'2px', letterSpacing:'0.06em' }}>{lbl.toUpperCase()}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Bottom buttons */}
      <div style={{
        width:'100%', padding:'0 24px',
        display:'flex', flexDirection:'column', gap:'10px',
        opacity: mounted ? 1 : 0,
        transform: mounted ? 'translateY(0)' : 'translateY(20px)',
        transition:'all 0.7s ease 0.7s',
      }}>
        <PrimaryButton
          label="Jugar ahora"
          gradient={`linear-gradient(135deg, ${tweak.accentGreen}, ${tweak.accentBlue})`}
          glowColor={tweak.accentGreen}
          onClick={onPlay}
          tweak={tweak}
        />
        <SecondaryButton
          label="Cómo jugar"
          onClick={onHowTo}
          tweak={tweak}
        />
      </div>
    </div>
  );
}

/* GAME SCREEN */
function GameScreen({ onBack, tweak }) {
  const [selected, setSelected] = useState([]);
  const [solved, setSolved] = useState([]);
  const [mistakes, setMistakes] = useState(0);
  const [shake, setShake] = useState(false);
  const [celebrating, setCelebrating] = useState(null);
  const [gameWon, setGameWon] = useState(false);
  const [words, setWords] = useState(ALL_WORDS);
  const maxMistakes = 4;

  const colors = {
    green: tweak.accentGreen, blue: tweak.accentBlue,
    yellow: tweak.accentYellow, red: tweak.accentRed
  };

  function toggleWord(word) {
    if (solved.some(g => g.words.includes(word))) return;
    if (selected.includes(word)) {
      setSelected(s => s.filter(w => w !== word));
    } else if (selected.length < 4) {
      setSelected(s => [...s, word]);
    }
  }

  function submit() {
    if (selected.length !== 4) return;
    const group = PUZZLE.groups.find(g =>
      selected.every(w => g.words.includes(w)) && g.words.every(w => selected.includes(w))
    );
    if (group) {
      setCelebrating(group.id);
      setTimeout(() => {
        setSolved(s => [...s, group]);
        setWords(w => w.filter(wd => !group.words.includes(wd)));
        setSelected([]);
        setCelebrating(null);
        if (solved.length + 1 === 4) setGameWon(true);
      }, 800);
    } else {
      setShake(true);
      setMistakes(m => m + 1);
      setTimeout(() => { setShake(false); setSelected([]); }, 600);
    }
  }

  function shuffle() {
    setWords(w => [...w].sort(() => Math.random() - 0.5));
  }

  const r = tweak.roundness;

  return (
    <div style={{
      width:'100%', height:'100%',
      background: tweak.bgColor,
      display:'flex', flexDirection:'column',
      overflow:'hidden',
    }}>
      {/* Header */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'16px 20px 8px',
      }}>
        <button onClick={onBack} style={{
          background:'none', border:'none', cursor:'pointer',
          color:'oklch(0.65 0.01 240)', fontSize:'24px', lineHeight:1,
          padding:'4px', display:'flex', alignItems:'center',
        }}>←</button>
        <div style={{
          display:'flex', gap:'2px',
        }}>
          {['N','E','X','O'].map((l,i) => (
            <span key={l} style={{
              fontSize:'22px', fontWeight:'900',
              color: Object.values(colors)[i],
              letterSpacing:'-1px',
              textShadow:`0 0 12px ${Object.values(colors)[i]}88`,
            }}>{l}</span>
          ))}
        </div>
        {/* Mistakes */}
        <div style={{ display:'flex', gap:'4px', alignItems:'center' }}>
          {Array.from({length: maxMistakes}).map((_,i) => (
            <div key={i} style={{
              width:'8px', height:'8px', borderRadius:'50%',
              background: i < mistakes ? tweak.accentRed : 'oklch(0.28 0.01 240)',
              boxShadow: i < mistakes ? `0 0 6px ${tweak.accentRed}` : 'none',
              transition:'all 0.3s ease',
            }}/>
          ))}
        </div>
      </div>

      {/* Divider */}
      <div style={{ height:'1px', background:'oklch(0.20 0.01 240)', margin:'0 20px' }}/>

      {/* Instruction */}
      <p style={{
        textAlign:'center', fontSize:'12px',
        color:'oklch(0.50 0.01 240)', fontFamily:'DM Sans, sans-serif',
        padding:'10px 20px 6px', letterSpacing:'0.05em',
      }}>
        ENCUENTRA GRUPOS DE CUATRO CONCEPTOS
      </p>

      {/* Solved groups */}
      <div style={{ padding:'0 14px', display:'flex', flexDirection:'column', gap:'6px' }}>
        {solved.map(group => (
          <div key={group.id} style={{
            borderRadius: r + 'px',
            background: colors[group.color],
            padding:'10px 14px',
            display:'flex', flexDirection:'column', gap:'2px',
            animation:'popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)',
          }}>
            <span style={{ fontSize:'11px', fontWeight:'700', color:'rgba(0,0,0,0.6)', letterSpacing:'0.08em' }}>
              {group.theme.toUpperCase()}
            </span>
            <span style={{ fontSize:'13px', fontWeight:'600', color:'rgba(0,0,0,0.85)' }}>
              {group.words.join(' · ')}
            </span>
          </div>
        ))}
      </div>

      {/* Word Grid */}
      <div style={{ flex:1, padding:'8px 14px 0', overflow:'hidden' }}>
        <div style={{
          display:'grid',
          gridTemplateColumns:'repeat(4, 1fr)',
          gap:'6px',
          animation: shake ? 'shakeGrid 0.5s ease' : 'none',
        }}>
          {words.map(word => {
            const isSel = selected.includes(word);
            const wGroup = getWordGroup(word);
            const isHinted = celebrating !== null && wGroup?.id === celebrating;
            const selColor = isSel ? tweak.accentBlue : null;
            return (
              <button key={word} onClick={() => toggleWord(word)} style={{
                background: isHinted
                  ? colors[wGroup.color]
                  : isSel
                    ? `${tweak.accentBlue}33`
                    : 'oklch(0.16 0.01 240)',
                border: `1.5px solid ${isHinted ? 'transparent' : isSel ? tweak.accentBlue : 'oklch(0.22 0.01 240)'}`,
                borderRadius: (parseInt(r)*0.7) + 'px',
                padding:'10px 4px',
                cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontFamily:'Outfit, sans-serif',
                fontSize:'11px', fontWeight:'700',
                color: isHinted ? 'rgba(0,0,0,0.85)' : isSel ? 'white' : 'oklch(0.85 0.01 240)',
                letterSpacing:'0.04em',
                boxShadow: isSel ? `0 0 0 1px ${tweak.accentBlue}, 0 4px 16px ${tweak.accentBlue}44` : 'none',
                transition:'all 0.15s ease',
                transform: isSel ? 'scale(0.96)' : 'scale(1)',
                minHeight:'48px',
              }}>{word}</button>
            );
          })}
        </div>
      </div>

      {/* Bottom Controls */}
      <div style={{
        padding:'12px 14px 28px',
        display:'flex', flexDirection:'column', gap:'8px',
      }}>
        <div style={{ display:'flex', gap:'8px' }}>
          <button onClick={shuffle} style={{
            flex:1, padding:'12px',
            background:'transparent',
            border:'1.5px solid oklch(0.25 0.01 240)',
            borderRadius: r + 'px',
            color:'oklch(0.65 0.01 240)',
            fontFamily:'Outfit, sans-serif', fontSize:'13px', fontWeight:'600',
            cursor:'pointer', letterSpacing:'0.03em',
            transition:'all 0.2s ease',
          }}>⇄ Mezclar</button>

          <button onClick={() => setSelected([])} style={{
            flex:1, padding:'12px',
            background:'transparent',
            border:'1.5px solid oklch(0.25 0.01 240)',
            borderRadius: r + 'px',
            color:'oklch(0.65 0.01 240)',
            fontFamily:'Outfit, sans-serif', fontSize:'13px', fontWeight:'600',
            cursor:'pointer', letterSpacing:'0.03em',
            transition:'all 0.2s ease',
          }}>✕ Limpiar</button>
        </div>

        <button onClick={submit} disabled={selected.length !== 4} style={{
          width:'100%', padding:'14px',
          background: selected.length === 4
            ? `linear-gradient(135deg, ${tweak.accentGreen}, ${tweak.accentBlue})`
            : 'oklch(0.18 0.01 240)',
          border:'none',
          borderRadius: r + 'px',
          color: selected.length === 4 ? 'white' : 'oklch(0.35 0.01 240)',
          fontFamily:'Outfit, sans-serif', fontSize:'14px', fontWeight:'700',
          cursor: selected.length === 4 ? 'pointer' : 'default',
          letterSpacing:'0.05em',
          boxShadow: selected.length === 4 ? `0 4px 24px ${tweak.accentGreen}55` : 'none',
          transition:'all 0.25s ease',
          transform: selected.length === 4 ? 'scale(1)' : 'scale(0.98)',
        }}>
          {selected.length === 4 ? 'CONFIRMAR →' : `SELECCIONA ${4 - selected.length} MÁS`}
        </button>
      </div>

      {/* WIN OVERLAY */}
      {gameWon && <WinOverlay onBack={onBack} tweak={tweak} colors={colors} />}
    </div>
  );
}

/* WIN OVERLAY */
function WinOverlay({ onBack, tweak, colors }) {
  return (
    <div style={{
      position:'absolute', inset:0,
      background:'rgba(10,10,15,0.92)',
      backdropFilter:'blur(8px)',
      display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center',
      gap:'16px', zIndex:50,
      animation:'fadeIn 0.4s ease',
      padding:'24px',
    }}>
      <div style={{ fontSize:'52px' }}>🎉</div>
      <div style={{ display:'flex', gap:'2px' }}>
        {['N','E','X','O'].map((l,i) => (
          <span key={l} style={{
            fontSize:'48px', fontWeight:'900',
            color:Object.values(colors)[i],
            textShadow:`0 0 30px ${Object.values(colors)[i]}99`,
          }}>{l}</span>
        ))}
      </div>
      <p style={{
        color:'white', fontWeight:'700', fontSize:'20px',
        textAlign:'center',
      }}>¡Resolviste el puzzle!</p>
      <p style={{
        color:'oklch(0.55 0.01 240)', fontFamily:'DM Sans, sans-serif',
        fontSize:'13px', textAlign:'center', lineHeight:'1.6',
      }}>Encontraste los 4 grupos correctamente.</p>
      <div style={{ display:'flex', gap:'10px', marginTop:'8px', width:'100%' }}>
        <button onClick={onBack} style={{
          flex:1, padding:'14px',
          background:'oklch(0.18 0.01 240)',
          border:'1.5px solid oklch(0.28 0.01 240)',
          borderRadius: tweak.roundness + 'px',
          color:'oklch(0.70 0.01 240)',
          fontFamily:'Outfit, sans-serif', fontSize:'13px', fontWeight:'700',
          cursor:'pointer', letterSpacing:'0.05em',
        }}>← Inicio</button>
        <button style={{
          flex:2, padding:'14px',
          background:`linear-gradient(135deg, ${tweak.accentGreen}, ${tweak.accentBlue})`,
          border:'none',
          borderRadius: tweak.roundness + 'px',
          color:'white',
          fontFamily:'Outfit, sans-serif', fontSize:'13px', fontWeight:'700',
          cursor:'pointer', letterSpacing:'0.05em',
          boxShadow:`0 4px 24px ${tweak.accentGreen}55`,
        }}>Nuevo puzzle →</button>
      </div>
    </div>
  );
}

/* HOW TO PLAY SCREEN */
function HowToScreen({ onBack, tweak }) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => { setTimeout(() => setMounted(true), 60); }, []);

  const steps = [
    {
      icon: '◉',
      color: tweak.accentBlue,
      title: 'Lee las 16 palabras',
      desc: 'Verás una cuadrícula con 16 conceptos o palabras mezcladas.',
    },
    {
      icon: '◈',
      color: tweak.accentGreen,
      title: 'Encuentra los 4 grupos',
      desc: 'Cada grupo de 4 palabras comparte algo en común: tema, categoría o patrón.',
    },
    {
      icon: '◆',
      color: tweak.accentYellow,
      title: 'Selecciona y confirma',
      desc: 'Toca 4 palabras y presiona CONFIRMAR. Verde = correcto, rojo = error.',
    },
    {
      icon: '★',
      color: tweak.accentRed,
      title: 'Solo 4 errores permitidos',
      desc: 'Si cometes 4 errores, el puzzle se revela. ¡Cuida cada movimiento!',
    },
  ];

  const groupColors = [tweak.accentGreen, tweak.accentBlue, tweak.accentYellow, tweak.accentRed];
  const groupLabels = ['Más fácil', 'Fácil', 'Difícil', 'Muy difícil'];

  return (
    <div style={{
      width:'100%', height:'100%',
      background: tweak.bgColor,
      display:'flex', flexDirection:'column',
      overflow:'hidden',
    }}>
      {/* Header */}
      <div style={{
        display:'flex', alignItems:'center', gap:'12px',
        padding:'16px 20px 12px',
      }}>
        <button onClick={onBack} style={{
          background:'none', border:'none', cursor:'pointer',
          color:'oklch(0.55 0.01 240)', fontSize:'22px',
          padding:'4px', display:'flex', alignItems:'center',
        }}>←</button>
        <h1 style={{
          fontSize:'20px', fontWeight:'800',
          color:'white', letterSpacing:'-0.3px',
        }}>Cómo jugar</h1>
      </div>

      <div style={{ height:'1px', background:'oklch(0.18 0.01 240)', margin:'0 20px' }}/>

      {/* Scrollable content */}
      <div style={{ flex:1, overflowY:'auto', padding:'16px 20px 24px' }}>

        {/* Steps */}
        <div style={{ display:'flex', flexDirection:'column', gap:'12px', marginBottom:'24px' }}>
          {steps.map((step, i) => (
            <div key={i} style={{
              display:'flex', gap:'14px', alignItems:'flex-start',
              background:'oklch(0.14 0.01 240)',
              borderRadius: tweak.roundness + 'px',
              padding:'14px 16px',
              border:`1px solid oklch(0.20 0.01 240)`,
              opacity: mounted ? 1 : 0,
              transform: mounted ? 'translateX(0)' : 'translateX(-16px)',
              transition:`all 0.5s ease ${i*0.1 + 0.1}s`,
            }}>
              <div style={{
                width:'36px', height:'36px', borderRadius:'10px',
                background: `${step.color}22`,
                border: `1.5px solid ${step.color}55`,
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:'16px', color: step.color,
                flexShrink:0,
              }}>{step.icon}</div>
              <div>
                <div style={{
                  fontSize:'13px', fontWeight:'700',
                  color:'white', marginBottom:'4px',
                }}>{step.title}</div>
                <div style={{
                  fontSize:'12px', color:'oklch(0.55 0.01 240)',
                  fontFamily:'DM Sans, sans-serif', lineHeight:'1.5',
                }}>{step.desc}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Difficulty legend */}
        <div style={{
          background:'oklch(0.12 0.01 240)',
          borderRadius: tweak.roundness + 'px',
          padding:'16px',
          border:'1px solid oklch(0.18 0.01 240)',
          opacity: mounted ? 1 : 0,
          transition:'all 0.5s ease 0.5s',
          marginBottom:'16px',
        }}>
          <p style={{
            fontSize:'11px', fontWeight:'700',
            color:'oklch(0.45 0.01 240)', letterSpacing:'0.08em',
            marginBottom:'12px',
          }}>DIFICULTAD DE GRUPOS</p>
          <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>
            {groupColors.map((col, i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                <div style={{
                  width:'28px', height:'10px',
                  borderRadius:'4px', background: col,
                  boxShadow:`0 0 8px ${col}88`,
                  flexShrink:0,
                }}/>
                <span style={{
                  fontSize:'12px', fontFamily:'DM Sans, sans-serif',
                  color:'oklch(0.65 0.01 240)',
                }}>{groupLabels[i]}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Tip */}
        <div style={{
          background:`${tweak.accentYellow}11`,
          border:`1px solid ${tweak.accentYellow}33`,
          borderRadius: tweak.roundness + 'px',
          padding:'12px 14px',
          opacity: mounted ? 1 : 0,
          transition:'all 0.5s ease 0.6s',
        }}>
          <p style={{
            fontSize:'12px', fontFamily:'DM Sans, sans-serif',
            color:`${tweak.accentYellow}`, fontWeight:'500',
            lineHeight:'1.5',
          }}>
            💡 <strong>Consejo:</strong> Cuidado con las palabras trampa que parecen pertenecer a dos grupos diferentes.
          </p>
        </div>
      </div>

      {/* Play button */}
      <div style={{ padding:'0 20px 32px' }}>
        <PrimaryButton
          label="¡Entendido, jugar!"
          gradient={`linear-gradient(135deg, ${tweak.accentGreen}, ${tweak.accentBlue})`}
          glowColor={tweak.accentGreen}
          onClick={onBack}
          tweak={tweak}
        />
      </div>
    </div>
  );
}

/* ─── SHARED COMPONENTS ─────────────────────────────────── */
function PrimaryButton({ label, gradient, glowColor, onClick, tweak }) {
  const [hover, setHover] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width:'100%', padding:'16px',
        background: gradient,
        border:'none',
        borderRadius: tweak.roundness + 'px',
        color:'white',
        fontFamily:'Outfit, sans-serif', fontSize:'15px', fontWeight:'800',
        cursor:'pointer', letterSpacing:'0.06em',
        boxShadow: hover ? `0 8px 40px ${glowColor}66` : `0 4px 20px ${glowColor}44`,
        transform: hover ? 'scale(1.015)' : 'scale(1)',
        transition:'all 0.2s ease',
      }}
    >{label}</button>
  );
}

function SecondaryButton({ label, onClick, tweak }) {
  const [hover, setHover] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width:'100%', padding:'15px',
        background:'transparent',
        border:`1.5px solid oklch(${hover ? '0.35' : '0.26'} 0.01 240)`,
        borderRadius: tweak.roundness + 'px',
        color:`oklch(${hover ? '0.80' : '0.65'} 0.01 240)`,
        fontFamily:'Outfit, sans-serif', fontSize:'15px', fontWeight:'600',
        cursor:'pointer', letterSpacing:'0.06em',
        transition:'all 0.2s ease',
      }}
    >{label}</button>
  );
}

/* ─── APP SHELL ─────────────────────────────────────────── */
function App() {
  const [tweak, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('home');

  return (
    <>
      <div className="scene">
        <IOSDevice dark={true}>
          <div style={{ width:'100%', height:'100%', position:'relative' }}>
            {screen === 'home' && (
              <HomeScreen
                onPlay={() => setScreen('game')}
                onHowTo={() => setScreen('howto')}
                tweak={tweak}
              />
            )}
            {screen === 'game' && (
              <GameScreen onBack={() => setScreen('home')} tweak={tweak} />
            )}
            {screen === 'howto' && (
              <HowToScreen onBack={() => setScreen('home')} tweak={tweak} />
            )}
          </div>
        </IOSDevice>
      </div>

      <TweaksPanel>
        <TweakSection label="Colores de grupo">
          <TweakColor label="Verde"    value={tweak.accentGreen}  onChange={v => setTweak('accentGreen', v)} />
          <TweakColor label="Azul"     value={tweak.accentBlue}   onChange={v => setTweak('accentBlue', v)} />
          <TweakColor label="Amarillo" value={tweak.accentYellow} onChange={v => setTweak('accentYellow', v)} />
          <TweakColor label="Rojo"     value={tweak.accentRed}    onChange={v => setTweak('accentRed', v)} />
          <TweakColor label="Fondo"    value={tweak.bgColor}      onChange={v => setTweak('bgColor', v)} />
        </TweakSection>
        <TweakSection label="Tipografía">
          <TweakSelect
            label="Fuente logo"
            value={tweak.fontDisplay}
            options={[
              {label:'Outfit', value:'Outfit'},
              {label:'DM Sans', value:'DM Sans'},
              {label:'Georgia', value:'Georgia'},
              {label:'Impact', value:'Impact'},
            ]}
            onChange={v => setTweak('fontDisplay', v)}
          />
        </TweakSection>
        <TweakSection label="Forma">
          <TweakSlider
            label="Redondez"
            value={parseInt(tweak.roundness)}
            min={6} max={28} step={2}
            onChange={v => setTweak('roundness', String(v))}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

  15%{transform:translateX(-6px)}

  60%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
  90%{transform:translateX(3px)}
}
@keyframes popIn {
  0%{transform:scale(0.92) translateY(4px); opacity:0}

  from{opacity:0} to{opacity:1}
}
