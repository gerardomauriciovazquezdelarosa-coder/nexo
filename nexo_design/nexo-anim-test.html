<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO Anim Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#0a0a0f;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
</style>
</head>
<body>
<canvas id="c" width="240" height="240"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 240, H = 240;

const GREEN  = '#3ecf6e';
const BLUE   = '#4d9eff';
const YELLOW = '#f5d547';
const RED    = '#f05a40';

// ── Grid cells (4×4) ──────────────────────────────────────
// Each cell: center x,y, size (half-width of square)
const GRID_CELLS = [];
const cellSize = 22;
const gap = 6;
const gridW = 4 * cellSize * 2 + 3 * gap;
const ox = W/2 - gridW/2 + cellSize;
const oy = H/2 - gridW/2 + cellSize;
const step = cellSize * 2 + gap;
for (let r = 0; r < 4; r++) {
  for (let c = 0; c < 4; c++) {
    GRID_CELLS.push({ x: ox + c * step, y: oy + r * step });
  }
}

// ── Hex cells (soccer-ball layout) ────────────────────────
// Classic soccer ball: 12 pentagons + 20 hexagons projected onto sphere.
// We'll use a flat hex grid offset pattern that looks like a ball when
// clipped to a circle, with 3 "rings".
// Center + inner ring (6) + outer ring (9) = 16 total → matches grid!

function hexPoly(cx, cy, r, flat=false) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (flat ? 0 : 30) + 60 * i;
    const rad = a * Math.PI / 180;
    pts.push([cx + r * Math.cos(rad), cy + r * Math.sin(rad)]);
  }
  return pts;
}

// Soccer hex layout: center hex + 2 rings
// Center: 1, ring1: 6 (at 60° steps, radius=hexR*√3), ring2: 9
const hexR = 24; // hex circumradius
const ballR = hexR * Math.sqrt(3); // ring 1 distance

const HEX_CENTERS = [];
// center
HEX_CENTERS.push({ x: W/2, y: H/2 });
// ring 1 — 6 hexes
for (let i = 0; i < 6; i++) {
  const a = (i * 60 - 30) * Math.PI / 180;
  HEX_CENTERS.push({ x: W/2 + ballR * Math.cos(a), y: H/2 + ballR * Math.sin(a) });
}
// ring 2 — 9 hexes (alternating positions for fuller coverage)
const ring2 = [0,40,80,120,160,200,240,280,320];
for (let i = 0; i < 9; i++) {
  const a = ring2[i] * Math.PI / 180;
  HEX_CENTERS.push({ x: W/2 + ballR * 1.88 * Math.cos(a), y: H/2 + ballR * 1.88 * Math.sin(a) });
}

// ── Color assignment ──────────────────────────────────────
// Grid: row-based. Hex: ring-based.
const GRID_COLORS = GRID_CELLS.map((_, i) => {
  const row = Math.floor(i / 4);
  return [GREEN, BLUE, YELLOW, RED][row];
});

// For hexes: center=blue, ring1 alternates green/yellow, ring2 red+mix
const HEX_COLORS = [
  BLUE,
  GREEN, YELLOW, GREEN, YELLOW, GREEN, YELLOW,
  RED, GREEN, RED, BLUE, RED, YELLOW, RED, GREEN, RED,
];

// ── Easing ────────────────────────────────────────────────
function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
}
function easeInOutQuart(t) {
  return t < 0.5 ? 8*t*t*t*t : 1 - Math.pow(-2*t+2,4)/2;
}

// ── Lerp helpers ──────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }

function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(lerp(r1,r2,t)).toString(16).padStart(2,'0');
  const g = Math.round(lerp(g1,g2,t)).toString(16).padStart(2,'0');
  const b = Math.round(lerp(b1,b2,t)).toString(16).padStart(2,'0');
  return `#${r}${g}${b}`;
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Draw helpers ──────────────────────────────────────────
function drawRoundRect(ctx, x, y, w, h, r, fill, stroke, strokeW=1.5) {
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h/2, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeW; ctx.stroke(); }
}

function drawHex(ctx, pts, fill, stroke, strokeW=1.5, alpha=1) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.globalAlpha = alpha;
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeW; ctx.stroke(); }
  ctx.globalAlpha = 1;
}

// ── Animation phases ──────────────────────────────────────
// Total cycle: 5s
// 0.0–0.3: hold grid
// 0.3–0.7: morph grid → ball
// 0.7–0.85: hold ball, rotate/pulse
// 0.85–0.97: morph ball → grid
// 0.97–1.0: hold grid

const CYCLE = 5000; // ms
let startTime = null;

function getPhase(elapsed) {
  const t = (elapsed % CYCLE) / CYCLE;
  if (t < 0.25) return { phase:'grid', local: t / 0.25 };
  if (t < 0.50) return { phase:'toball', local: (t-0.25)/0.25 };
  if (t < 0.75) return { phase:'ball', local: (t-0.50)/0.25 };
  return { phase:'togrid', local: (t-0.75)/0.25 };
}

function drawBallGlow(progress) {
  // Sphere shadow/glow behind ball
  const grd = ctx.createRadialGradient(W/2-12, H/2-12, 4, W/2, H/2, 88);
  grd.addColorStop(0, `rgba(62,207,110,${0.08*progress})`);
  grd.addColorStop(0.4, `rgba(77,158,255,${0.06*progress})`);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(W/2, H/2, 100, 0, Math.PI*2);
  ctx.fill();
}

function drawClipCircle(radius) {
  ctx.beginPath();
  ctx.arc(W/2, H/2, radius, 0, Math.PI*2);
  ctx.clip();
}

function render(ts) {
  if (!startTime) startTime = ts;
  const elapsed = ts - startTime;
  const { phase, local } = getPhase(elapsed);

  ctx.clearRect(0, 0, W, H);

  if (phase === 'grid') {
    drawGrid(1);
  }
  else if (phase === 'toball') {
    const t = easeInOutQuart(local);
    drawTransition(t);
  }
  else if (phase === 'ball') {
    drawBall(1, local);
  }
  else if (phase === 'togrid') {
    const t = easeInOutQuart(local);
    drawTransition(1 - t);
  }

  requestAnimationFrame(render);
}

// ── Draw states ───────────────────────────────────────────

function drawGrid(opacity) {
  ctx.globalAlpha = opacity;
  for (let i = 0; i < 16; i++) {
    const { x, y } = GRID_CELLS[i];
    const col = GRID_COLORS[i];
    const isActive = Math.floor(i/4) === i%4;
    const bg = isActive ? col : hexToRgba(col, 0.18);
    const glow = isActive ? `${col}` : null;

    if (isActive) {
      ctx.shadowColor = col;
      ctx.shadowBlur = 8;
    }
    drawRoundRect(ctx, x, y, cellSize*2-2, cellSize*2-2, 5,
      bg,
      isActive ? hexToRgba(col, 0.8) : hexToRgba(col, 0.25),
      1.5
    );
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawBall(opacity, localT) {
  // Subtle rotation feel: offset centers slightly over time
  const pulse = Math.sin(localT * Math.PI * 2) * 2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(W/2, H/2, 88, 0, Math.PI*2);
  ctx.clip();

  drawBallGlow(opacity);

  // draw sphere sheen
  const sheen = ctx.createRadialGradient(W/2-28, H/2-28, 4, W/2, H/2, 90);
  sheen.addColorStop(0, `rgba(255,255,255,${0.08*opacity})`);
  sheen.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sheen;
  ctx.beginPath();
  ctx.arc(W/2, H/2, 90, 0, Math.PI*2);
  ctx.fill();

  for (let i = 0; i < 16; i++) {
    const hc = HEX_CENTERS[i];
    const col = HEX_COLORS[i] || BLUE;
    const pts = hexPoly(hc.x + pulse * (i%3-1) * 0.2, hc.y, hexR - 2);

    // distance from center for sphere shading
    const dist = Math.sqrt((hc.x-W/2)**2 + (hc.y-H/2)**2);
    const shade = Math.max(0, 1 - dist/110);

    ctx.shadowColor = col;
    ctx.shadowBlur = 6 * opacity;
    drawHex(ctx, pts,
      hexToRgba(col, (0.22 + shade * 0.18) * opacity),
      hexToRgba(col, (0.60 + shade * 0.25) * opacity),
      1.5, 1
    );
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  // Outer ring
  ctx.beginPath();
  ctx.arc(W/2, H/2, 87, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(255,255,255,${0.06*opacity})`;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawTransition(t) {
  // t=0: grid, t=1: ball
  const te = easeInOutCubic(t);

  // Ball clip grows from 0 to 88
  const ballClipR = lerp(0, 88, te);
  // Grid cells shrink and move toward hex positions
  // Hex cells grow from squares

  // Draw grid fading out
  ctx.save();
  ctx.globalAlpha = 1 - te;
  for (let i = 0; i < 16; i++) {
    const gc = GRID_CELLS[i];
    const hc = HEX_CENTERS[i];
    // interpolate position
    const cx = lerp(gc.x, hc.x, te);
    const cy = lerp(gc.y, hc.y, te);
    const col = GRID_COLORS[i];
    const isActive = Math.floor(i/4) === i%4;
    const bg = isActive ? col : hexToRgba(col, 0.18);
    const sz = lerp(cellSize*2-2, 0, te);

    if (isActive && te < 0.5) {
      ctx.shadowColor = col;
      ctx.shadowBlur = 8 * (1-te*2);
    }
    drawRoundRect(ctx, cx, cy, sz, sz, lerp(5, 16, te), bg,
      isActive ? hexToRgba(col, 0.8*(1-te)) : hexToRgba(col, 0.25*(1-te)), 1.5);
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // Draw hex ball growing in
  if (te > 0.1) {
    const ballT = Math.min(1, (te - 0.1) / 0.9);
    ctx.save();
    ctx.beginPath();
    ctx.arc(W/2, H/2, ballClipR, 0, Math.PI*2);
    ctx.clip();

    drawBallGlow(ballT);

    for (let i = 0; i < 16; i++) {
      const hc = HEX_CENTERS[i];
      const col = HEX_COLORS[i] || BLUE;
      const r = lerp(0, hexR - 2, ballT);
      const pts = hexPoly(hc.x, hc.y, r);
      const dist = Math.sqrt((hc.x-W/2)**2 + (hc.y-H/2)**2);
      const shade = Math.max(0, 1 - dist/110);

      ctx.shadowColor = col;
      ctx.shadowBlur = 4 * ballT;
      drawHex(ctx, pts,
        hexToRgba(col, (0.22 + shade * 0.18) * ballT),
        hexToRgba(col, (0.60 + shade * 0.25) * ballT),
        1.5, 1
      );
      ctx.shadowBlur = 0;
    }
    ctx.restore();

    // ring
    ctx.beginPath();
    ctx.arc(W/2, H/2, ballClipR, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,255,255,${0.06*ballT})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

requestAnimationFrame(render);
</script>
</body>
</html>
