<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NEXO Ball v4 — 1-2-3-2-1</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#0a0a0f; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 500, H = 220;
canvas.width = W; canvas.height = H;

const GREEN  = '#3ecf6e';
const BLUE   = '#4d9eff';
const YELLOW = '#f5d547';
const RED    = '#f05a40';
const COLS   = [GREEN, BLUE, YELLOW, RED];

// ── Pointy-top hex geometry ───────────────────────────
// Pointy-top: flat sides left/right, points top/bottom
// circumradius R
// width  = R * sqrt(3)
// height = 2 * R
// horizontal spacing (col): R * sqrt(3)
// vertical spacing (row):   R * 1.5
// odd rows offset by R * sqrt(3) / 2

// Pattern 1-2-3-2-1 (5 rows):
// Row 0 (top):    1 hex,  offset 0
// Row 1:          2 hexes, offset ±0.5 col
// Row 2 (middle): 3 hexes, offset -1, 0, +1 col
// Row 3:          2 hexes, offset ±0.5 col
// Row 4 (bottom): 1 hex,  offset 0
//
// For pointy-top, col spacing = R*sqrt(3), row spacing = R*1.5
// Odd rows shift right by R*sqrt(3)/2

const R  = 36; // hex circumradius
const CW = R * Math.sqrt(3);   // column width
const RH = R * 1.5;            // row height

// Ball center
const BCX = 100, BCY = H / 2;

// Define the 9 hexes explicitly in 1-2-3-2-1 pattern
// using axial/offset coordinates then convert to pixel
// pointy-top: x = CW * (col + row*0.5), y = RH * row  (for hex grid)
// We'll use simple row/col offsets:

const HEX_LAYOUT = [
  // row, col_offset (from center)
  // Row 0 — 1 hex
  { row: -2, col:  0 },
  // Row 1 — 2 hexes
  { row: -1, col: -0.5 },
  { row: -1, col:  0.5 },
  // Row 2 — 3 hexes (middle)
  { row:  0, col: -1 },
  { row:  0, col:  0 },
  { row:  0, col:  1 },
  // Row 3 — 2 hexes
  { row:  1, col: -0.5 },
  { row:  1, col:  0.5 },
  // Row 4 — 1 hex
  { row:  2, col:  0 },
];

// Colors alternating in a visually balanced way
const HEX_COLS = [
  BLUE,                    // top center
  GREEN,   RED,            // row 1
  YELLOW,  BLUE,   GREEN,  // row 2 middle
  RED,     YELLOW,         // row 3
  GREEN,                   // bottom center
];

// Convert to pixel centers
const hexes = HEX_LAYOUT.map((h, i) => ({
  cx: BCX + h.col * CW,
  cy: BCY + h.row * RH * (4/3),  // use full 2R row spacing for clean pointy-top fit
  color: HEX_COLS[i],
}));

// Recompute with correct pointy-top spacing:
// Pointy-top row spacing = R * sqrt(3) (center-to-center vertically)
// Pointy-top col spacing = R * 1.5 (center-to-center for offset grid)
// But for our explicit layout we use:
//   vertical center-to-center = R * sqrt(3)
//   horizontal center-to-center = R * 1.5 ... no
//
// Let me be precise:
// Pointy-top hexes touch edge-to-edge when:
//   same row neighbors: dx = R*sqrt(3), dy = 0
//   adjacent row offset neighbors: dx = R*sqrt(3)/2, dy = R*1.5
//
// So for 1-2-3-2-1 pattern (pointy-top):
// Middle row (row 2): 3 hexes at x = BCX + [-1,0,1]*R*sqrt(3), y = BCY
// Rows 1,3: 2 hexes offset by ±R*sqrt(3)/2, y = BCY ± R*1.5
// Rows 0,4: 1 hex at x = BCX, y = BCY ± R*3

const S3 = Math.sqrt(3);
const hexesFinal = [
  // row 0 — top
  { cx: BCX,                  cy: BCY - R*3,    color: BLUE   },
  // row 1
  { cx: BCX - S3/2*R,         cy: BCY - R*1.5,  color: GREEN  },
  { cx: BCX + S3/2*R,         cy: BCY - R*1.5,  color: RED    },
  // row 2 — middle
  { cx: BCX - S3*R,           cy: BCY,           color: YELLOW },
  { cx: BCX,                  cy: BCY,           color: BLUE   },
  { cx: BCX + S3*R,           cy: BCY,           color: GREEN  },
  // row 3
  { cx: BCX - S3/2*R,         cy: BCY + R*1.5,  color: RED    },
  { cx: BCX + S3/2*R,         cy: BCY + R*1.5,  color: YELLOW },
  // row 4 — bottom
  { cx: BCX,                  cy: BCY + R*3,    color: GREEN  },
];

// ── Pointy-top hex vertices ───────────────────────────
function pointyHexPts(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (30 + i * 60) * Math.PI / 180; // pointy-top: start at 30°
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}

function h2r(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function fillPoly(pts, fill, stroke, sw) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill)   { ctx.fillStyle = fill;    ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

// Compute bounding circle for clip
const allX = hexesFinal.map(h => h.cx);
const allY = hexesFinal.map(h => h.cy);
const minX = Math.min(...allX) - R;
const maxX = Math.max(...allX) + R;
const minY = Math.min(...allY) - R;
const maxY = Math.max(...allY) + R;
const bw = maxX - minX, bh = maxY - minY;
const ballR = Math.max(bw, bh) / 2 * 1.02;

function eio(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }

function drawBall(rot, alpha) {
  // Ambient glow
  const glow = ctx.createRadialGradient(BCX, BCY, 4, BCX, BCY, ballR*1.5);
  glow.addColorStop(0,   h2r(BLUE,  0.15 * alpha));
  glow.addColorStop(0.5, h2r(GREEN, 0.07 * alpha));
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(BCX, BCY, ballR*1.5, 0, Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(BCX, BCY);
  ctx.rotate(rot);
  ctx.translate(-BCX, -BCY);

  for (const h of hexesFinal) {
    const col = h.color;
    // Sphere shading: brighter near center
    const dist  = Math.hypot(h.cx - BCX, h.cy - BCY);
    const shade = 1 - (dist / (ballR)) * 0.5;
    const pts   = pointyHexPts(h.cx, h.cy, R);

    ctx.shadowColor = col;
    ctx.shadowBlur  = 10 * alpha;
    fillPoly(pts,
      h2r(col, (0.40 + shade * 0.40) * alpha),
      h2r(col, (0.80 + shade * 0.15) * alpha),
      1.0
    );
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  // Specular highlight
  ctx.save();
  const spec = ctx.createRadialGradient(
    BCX - ballR*0.28, BCY - ballR*0.28, 2,
    BCX, BCY, ballR * 1.1
  );
  spec.addColorStop(0,   `rgba(255,255,255,${0.20 * alpha})`);
  spec.addColorStop(0.35,`rgba(255,255,255,${0.05 * alpha})`);
  spec.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = spec;
  // Clip to the convex hull of hexes (approximate with ellipse)
  ctx.beginPath();
  ctx.ellipse(BCX, BCY, ballR*0.95, ballR*0.95, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ── Draw ¡GOOOOOOOL! ──────────────────────────────────
const WORD  = '¡GOOOOOOOL!';
const WLEN  = WORD.length;
const LCOLS = [YELLOW,GREEN,BLUE,YELLOW,RED,GREEN,BLUE,YELLOW,RED,GREEN,YELLOW];
const FSIZE = 28;
const LW    = 27;
const START_X = 195;

function drawGoool(progress, alpha) {
  ctx.save();
  ctx.font = `900 ${FSIZE}px Outfit, Arial Black, sans-serif`;
  ctx.textBaseline = 'middle';
  for (let i = 0; i < WLEN; i++) {
    const lp = clamp((progress - i/WLEN)/(1/WLEN), 0, 1);
    if (lp <= 0) continue;
    const ep  = eio(lp);
    const col = LCOLS[i];
    const lx  = START_X + i * LW + LW/2;
    const ly  = BCY + lerp(-20, 0, ep);
    const sc  = lerp(0.2, 1, ep);
    ctx.save();
    ctx.translate(lx, ly); ctx.scale(sc, sc);
    ctx.globalAlpha = ep * alpha;
    const tw = ctx.measureText(WORD[i]).width;
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.strokeText(WORD[i], -tw/2, 0);
    ctx.fillStyle = col;
    ctx.fillText(WORD[i], -tw/2, 0);
    ctx.restore();
  }
  ctx.restore();
}

const CYCLE = 5000;
let start = null;

function render(ts) {
  if (!start) start = ts;
  const t = ((ts - start) % CYCLE) / CYCLE;
  ctx.clearRect(0, 0, W, H);

  let bA=1, rot=0, gP=0, gA=0;
  if      (t < 0.10) { bA = eio(t/0.10); }
  else if (t < 0.50) { rot = ((t-0.10)/0.40) * Math.PI * 2/3; }
  else if (t < 0.78) { rot = Math.PI*2/3; gP=(t-0.50)/0.28; gA=1; }
  else if (t < 0.88) { rot = Math.PI*2/3; gP=1; gA=1; }
  else { const fa=1-eio((t-0.88)/0.12); rot=Math.PI*2/3; gP=1; bA=fa; gA=fa; }

  drawBall(rot, bA);
  if (gA > 0) drawGoool(gP, gA);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
