<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NEXO Soccer Ball — Exact Geometry</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#0a0a0f; display:flex; align-items:center; justify-content:center; }
.wrap { animation: spin 8s linear infinite; filter: drop-shadow(0 0 20px rgba(34,197,94,0.25)) drop-shadow(0 0 40px rgba(59,130,246,0.15)); }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="wrap" id="ball"></div>
<script>
// ── Exact soccer ball geometry ────────────────────────────
// A classic soccer ball is a truncated icosahedron:
// 12 pentagons + 20 hexagons.
// We project the front-facing patches onto a 2D circle.
//
// Standard construction:
//   - 1 center pentagon
//   - 5 hexagons touching the center pentagon
//   - 5 pentagons touching those hexagons (ring 1)
//   - 5 hexagons connecting ring-1 pentagons
//   - partial patches at boundary
//
// All coordinates derived from the actual 3D truncated icosahedron
// vertices, projected orthographically along the z-axis.
// Pentagon circumradius on unit sphere ≈ 0.309, hexagon ≈ 0.263

const R = 110; // SVG circle radius
const CX = 0, CY = 0; // center

// ── Pentagon geometry ─────────────────────────────────────
// Flat-top pentagon: 5 vertices, inner angle 108°
function pentagonPts(cx, cy, r, rotDeg = 0) {
  const pts = [];
  for (let i = 0; i < 5; i++) {
    const a = ((i * 72) + rotDeg - 90) * Math.PI / 180;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts.map(p => p[0].toFixed(3) + ',' + p[1].toFixed(3)).join(' ');
}

// ── Hexagon geometry ──────────────────────────────────────
function hexPts(cx, cy, r, rotDeg = 0) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = ((i * 60) + rotDeg) * Math.PI / 180;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts.map(p => p[0].toFixed(3) + ',' + p[1].toFixed(3)).join(' ');
}

// ── Soccer ball proportions ───────────────────────────────
// On a real ball:
//   pentagon edge length e ≈ 0.382 * sphere_radius
//   hexagon edge length  ≈ same e (all edges equal)
//   pentagon circumradius  = e / (2 sin(π/5)) ≈ e * 0.851
//   hexagon circumradius   = e (for regular hexagon)
//
// For R=110: e ≈ 35, pentagon cr ≈ 30, hexagon cr ≈ 35

const e    = 34;   // edge length
const PR   = 29;   // pentagon circumradius
const HR   = 34;   // hexagon circumradius

// ── Patch centers (projected from 3D) ────────────────────
// The truncated icosahedron front face:
// Center pentagon at origin.
// 5 hexagons around it at distance d1, every 72°, offset 36°.
// 5 pentagons (ring 1) at distance d2, every 72°.
// 5 more hexagons at distance d3.
// 5 pentagons (ring 2) at distance d4 (partially visible).

// On the actual sphere (radius R):
// d1 (center→hex center) ≈ R * 0.56
// d2 (center→ring1 pent) ≈ R * 0.93
// d3 (center→ring2 hex)  ≈ R * 1.05
// d4 (center→ring2 pent) ≈ R * 1.28 (clipped)

const d1 = R * 0.54;
const d2 = R * 0.90;
const d3 = R * 1.04;
const d4 = R * 1.26;

// ── Colors ────────────────────────────────────────────────
const GREEN  = '#22c55e';
const BLUE   = '#3b82f6';
const YELLOW = '#f59e0b';
const RED    = '#ef4444';
const PCOLS  = [GREEN, BLUE, YELLOW, RED, GREEN]; // 5 ring-1 pentagons
const PCOLS2 = [BLUE, YELLOW, RED, GREEN, BLUE];  // 5 ring-2 pentagons

// ── Build SVG ─────────────────────────────────────────────
// Patches drawn back-to-front for correct layering.
// hex first, then pentagons on top.

let patches = [];

// Ring-2 hexagons (background, outer)
for (let i = 0; i < 5; i++) {
  const a = (i * 72 + 36) * Math.PI / 180;
  const cx = d3 * Math.cos(a), cy = d3 * Math.sin(a);
  const rot = i * 72 + 36;
  patches.push(`<polygon points="${hexPts(cx,cy,HR,rot)}" fill="white" stroke="#c8c8c8" stroke-width="1.8" stroke-linejoin="round"/>`);
}

// Ring-2 pentagons (partially clipped)
for (let i = 0; i < 5; i++) {
  const a = (i * 72) * Math.PI / 180;
  const cx = d4 * Math.cos(a), cy = d4 * Math.sin(a);
  const rot = i * 72 + 36;
  patches.push(`<polygon points="${pentagonPts(cx,cy,PR,rot)}" fill="${PCOLS2[i]}" stroke="white" stroke-width="2" stroke-linejoin="round"/>`);
}

// Ring-1 hexagons
for (let i = 0; i < 5; i++) {
  const a = (i * 72 + 36) * Math.PI / 180;
  const cx = d1 * Math.cos(a), cy = d1 * Math.sin(a);
  const rot = i * 72 + 36;
  patches.push(`<polygon points="${hexPts(cx,cy,HR,rot)}" fill="white" stroke="#c8c8c8" stroke-width="1.8" stroke-linejoin="round"/>`);
}

// Ring-1 pentagons
for (let i = 0; i < 5; i++) {
  const a = (i * 72) * Math.PI / 180;
  const cx = d2 * Math.cos(a), cy = d2 * Math.sin(a);
  const rot = i * 72;
  patches.push(`<polygon points="${pentagonPts(cx,cy,PR,rot)}" fill="${PCOLS[i]}" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>`);
}

// Center pentagon — BLUE
patches.push(`<polygon points="${pentagonPts(0,0,PR,0)}" fill="${BLUE}" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>`);

const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-R-4} ${-R-4} ${(R+4)*2} ${(R+4)*2}" width="240" height="240">
  <defs>
    <clipPath id="bc"><circle cx="0" cy="0" r="${R}"/></clipPath>
    <radialGradient id="sh" cx="35%" cy="28%" r="55%">
      <stop offset="0%"  stop-color="white" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <circle cx="0" cy="0" r="${R+2}" fill="rgba(34,197,94,0.06)" />

  <g clip-path="url(#bc)">
    <circle cx="0" cy="0" r="${R}" fill="white"/>
    ${patches.join('\n    ')}
    <circle cx="0" cy="0" r="${R}" fill="url(#sh)"/>
  </g>
  <circle cx="0" cy="0" r="${R}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>`;

document.getElementById('ball').innerHTML = svg;
</script>
</body>
</html>
