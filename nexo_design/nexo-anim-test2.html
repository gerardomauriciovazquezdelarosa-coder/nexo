<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NEXO — Hex Ball Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#0a0a0f;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Canvas size: ball on left, GOOOL on right
const W = 420, H = 200;
canvas.width = W; canvas.height = H;

const GREEN  = '#3ecf6e';
const BLUE   = '#4d9eff';
const YELLOW = '#f5d547';
const RED    = '#f05a40';
const COLORS = [GREEN, BLUE, YELLOW, RED];

// ── Hex geometry ─────────────────────────────────────────
// Flat-top hexagon tessellation, perfectly tight (no gaps).
// Unit hex: radius R, flat-top means:
//   width  = 2R
//   height = R*sqrt(3)
//   col step (x) = 1.5*R
//   row step (y) = R*sqrt(3)
//   odd cols offset by R*sqrt(3)/2

const BALL_CX = 95, BALL_CY = 100, BALL_R = 82;
const HEX_R = 18; // circumradius
const HW = HEX_R;                    // half-width
const HH = HEX_R * Math.sqrt(3) / 2; // half-height

// Generate flat-top hex centers in a grid, keep those inside the ball circle
function flatTopHexPts(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (i * 60) * Math.PI / 180; // flat-top: 0°,60°,...
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}

// Build tessellation
const hexes = [];
const colStep = HEX_R * 1.5;
const rowStep = HEX_R * Math.sqrt(3);

for (let col = -5; col <= 5; col++) {
  for (let row = -5; row <= 5; row++) {
    const cx = BALL_CX + col * colStep;
    const cy = BALL_CY + row * rowStep + (col % 2 !== 0 ? rowStep / 2 : 0);
    const dist = Math.sqrt((cx - BALL_CX) ** 2 + (cy - BALL_CY) ** 2);
    if (dist < BALL_R - HEX_R * 0.5) {
      // Assign color by angle sector
      const angle = Math.atan2(cy - BALL_CY, cx - BALL_CX);
      const sector = Math.floor(((angle + Math.PI) / (Math.PI * 2)) * 4) % 4;
      // vary by distance ring too
      const ring = Math.floor(dist / (HEX_R * 1.5));
      const colorIdx = (sector + ring) % 4;
      hexes.push({ cx, cy, colorIdx, dist, ring });
    }
  }
}

// ── Helpers ───────────────────────────────────────────────
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function lerp(a,b,t){ return a+(b-a)*t; }
function eio(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function eio4(t){ return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ── Draw hex ──────────────────────────────────────────────
function drawFlatHex(cx, cy, r, fill, stroke, sw) {
  const pts = flatTopHexPts(cx, cy, r);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < 6; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill)  { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

// ── Draw the ball ─────────────────────────────────────────
function drawBall(rotAngle, alpha) {
  ctx.save();
  // clip to circle
  ctx.beginPath();
  ctx.arc(BALL_CX, BALL_CY, BALL_R, 0, Math.PI * 2);
  ctx.clip();

  // dark base
  ctx.fillStyle = `rgba(8,8,14,${alpha})`;
  ctx.fillRect(BALL_CX - BALL_R, BALL_CY - BALL_R, BALL_R*2, BALL_R*2);

  // rotate hexes by rotAngle
  ctx.save();
  ctx.translate(BALL_CX, BALL_CY);
  ctx.rotate(rotAngle);
  ctx.translate(-BALL_CX, -BALL_CY);

  for (const h of hexes) {
    const col = COLORS[h.colorIdx];
    const shade = Math.max(0.0, 1 - h.dist / (BALL_R * 1.1));
    const brightness = 0.30 + shade * 0.35;
    const borderBrightness = 0.65 + shade * 0.25;
    ctx.shadowColor = col;
    ctx.shadowBlur = 3 * alpha;
    drawFlatHex(h.cx, h.cy, HEX_R - 0.5,
      hexToRgba(col, brightness * alpha),
      hexToRgba(col, borderBrightness * alpha),
      0.8
    );
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // sphere sheen overlay
  const sheen = ctx.createRadialGradient(
    BALL_CX - 26, BALL_CY - 26, 4,
    BALL_CX, BALL_CY, BALL_R
  );
  sheen.addColorStop(0, `rgba(255,255,255,${0.14 * alpha})`);
  sheen.addColorStop(0.45, `rgba(255,255,255,${0.03 * alpha})`);
  sheen.addColorStop(1, `rgba(0,0,0,${0.25 * alpha})`);
  ctx.fillStyle = sheen;
  ctx.beginPath();
  ctx.arc(BALL_CX, BALL_CY, BALL_R, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // outer ring
  ctx.beginPath();
  ctx.arc(BALL_CX, BALL_CY, BALL_R, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255,255,255,${0.10 * alpha})`;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ── Draw "¡GOOOL!" ────────────────────────────────────────
// Letters appear one-by-one, then fade out
const GOOOL = ['¡', 'G', 'O', 'O', 'O', 'L', '!'];
const LETTER_COLORS = [YELLOW, GREEN, BLUE, YELLOW, RED, GREEN, YELLOW];

function drawGoool(progress, alpha) {
  // progress: 0→1 = letters appearing
  // each letter appears at progress = i / GOOOL.length
  const startX = 205;
  const letterW = 30;
  const baseY = BALL_CY + 10;
  const fontSize = 38;

  ctx.save();
  ctx.font = `900 ${fontSize}px 'Outfit', system-ui, sans-serif`;
  ctx.textBaseline = 'middle';

  for (let i = 0; i < GOOOL.length; i++) {
    const letterProgress = clamp((progress - i / GOOOL.length) / (1 / GOOOL.length), 0, 1);
    if (letterProgress <= 0) continue;

    const ep = eio(letterProgress);
    const col = LETTER_COLORS[i];

    // bounce in from top
    const yOff = lerp(-24, 0, ep);
    const scale = lerp(0.4, 1, ep);
    const lx = startX + i * letterW;
    const ly = baseY + yOff;

    ctx.save();
    ctx.translate(lx + letterW/2, ly);
    ctx.scale(scale, scale);
    ctx.globalAlpha = ep * alpha;

    // glow
    ctx.shadowColor = col;
    ctx.shadowBlur = 18;

    // outline
    ctx.strokeStyle = `rgba(0,0,0,0.5)`;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.strokeText(GOOOL[i], -ctx.measureText(GOOOL[i]).width / 2, 0);

    // fill
    ctx.fillStyle = col;
    ctx.fillText(GOOOL[i], -ctx.measureText(GOOOL[i]).width / 2, 0);

    ctx.shadowBlur = 0;
    ctx.restore();
  }
  ctx.restore();
}

// ── Animation timeline ────────────────────────────────────
// Total: 4.5s
// 0.00–0.15: ball appears (fade in)
// 0.15–0.55: ball rotates
// 0.55–0.80: GOOOL! letters appear one by one
// 0.80–0.90: everything holds
// 0.90–1.00: fade out

const CYCLE = 4500;
let start = null;

function render(ts) {
  if (!start) start = ts;
  const t = ((ts - start) % CYCLE) / CYCLE;

  ctx.clearRect(0, 0, W, H);

  let ballAlpha = 1;
  let ballRot = 0;
  let gooolProgress = 0;
  let gooolAlpha = 0;

  if (t < 0.15) {
    // ball fade in
    ballAlpha = eio(t / 0.15);
    ballRot = 0;
  } else if (t < 0.55) {
    // ball rotates
    const rt = (t - 0.15) / 0.40;
    ballRot = rt * Math.PI * 0.6; // 108° rotation
    ballAlpha = 1;
  } else if (t < 0.80) {
    // GOOOL appears
    const gt = (t - 0.55) / 0.25;
    ballRot = Math.PI * 0.6;
    ballAlpha = 1;
    gooolProgress = gt;
    gooolAlpha = 1;
  } else if (t < 0.90) {
    // hold
    ballRot = Math.PI * 0.6;
    ballAlpha = 1;
    gooolProgress = 1;
    gooolAlpha = 1;
  } else {
    // fade out
    const ft = (t - 0.90) / 0.10;
    const fa = 1 - eio(ft);
    ballRot = Math.PI * 0.6;
    ballAlpha = fa;
    gooolProgress = 1;
    gooolAlpha = fa;
  }

  // ambient glow behind ball
  const glow = ctx.createRadialGradient(BALL_CX, BALL_CY, 10, BALL_CX, BALL_CY, BALL_R * 1.3);
  glow.addColorStop(0, hexToRgba(GREEN, 0.10 * ballAlpha));
  glow.addColorStop(0.5, hexToRgba(BLUE, 0.05 * ballAlpha));
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(BALL_CX, BALL_CY, BALL_R * 1.4, 0, Math.PI * 2); ctx.fill();

  drawBall(ballRot, ballAlpha);

  if (gooolAlpha > 0) {
    drawGoool(gooolProgress, gooolAlpha);
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
