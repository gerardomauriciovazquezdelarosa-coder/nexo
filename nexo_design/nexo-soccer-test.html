<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NEXO Soccer Ball</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#0a0a0f;
  display:flex; align-items:center; justify-content:center;
}
.ball-wrap {
  animation: spin 6s linear infinite;
  transform-origin: center;
  filter: drop-shadow(0 0 18px rgba(62,207,110,0.3)) drop-shadow(0 0 36px rgba(77,158,255,0.15));
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!--
  Classic soccer ball geometry:
  12 pentagons + 20 hexagons projected onto sphere.
  We draw a flat approximation clipped to a circle.
  
  Layout: center pentagon + 5 surrounding hexagons + 5 pentagons in ring 1
          + 5 hexagons + 5 pentagons in ring 2 (outer edge)
  
  We'll hand-place key patches visible on the front face:
  - 1 center pentagon
  - 5 hexagons around it (touching center)
  - 5 pentagons (between outer hexagons)
  - partial patches at edges
  
  All coordinates within a 200×200 viewBox, circle radius 96, center (100,100).
  Colors: pentagons = NEXO colors cycling [GREEN,BLUE,YELLOW,RED,GREEN,...]
          hexagons  = white with NEXO border
-->

<div class="ball-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="220" height="220">
  <defs>
    <!-- Clip to circle -->
    <clipPath id="ballClip">
      <circle cx="100" cy="100" r="97"/>
    </clipPath>
    <!-- Specular highlight -->
    <radialGradient id="shine" cx="38%" cy="32%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.28"/>
      <stop offset="45%"  stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.20"/>
    </radialGradient>
    <!-- Shadow bottom -->
    <radialGradient id="shadow" cx="50%" cy="75%" r="50%">
      <stop offset="0%"   stop-color="black" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="black" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#ballClip)">

    <!-- White base -->
    <circle cx="100" cy="100" r="97" fill="white"/>

    <!--
    SOCCER BALL PATCH GEOMETRY
    ===========================
    Classic truncated icosahedron projected to sphere.
    
    Front face: center pentagon surrounded by 5 hexagons,
    each hexagon flanked by 2 pentagons.
    
    Pentagon: 5-sided, ~26px circumradius at center scale
    Hexagon:  6-sided, ~28px circumradius
    
    Using pointy-top for hexagons, flat-top for pentagons.
    
    Key centers (approximate spherical projection):
    
    Center pentagon: (100, 100)
    
    5 hexagons around center (at ~52px from center, every 72°):
      H0: angle=-90°  → (100, 48)
      H1: angle=-18°  → (149, 67)
      H2: angle= 54°  → (131,116)
      H3: angle=126°  → ( 69,116)
      H4: angle=198°  → ( 51, 67)
    
    5 pentagons between hexagons (at ~90px from center, every 72°, offset 36°):
      P1: angle=-54°  → (131, 51)
      P2: angle= 18°  → (156,100)
      P3: angle= 90°  → (100,143)
      P4: angle=162°  → ( 44,100)
      P5: angle=234°  → ( 69, 51)
    
    Outer ring partial patches (beyond 90px):
      P6-P10 at ~130px (partial, clipped)
    -->

    <!-- ═══ CENTER PENTAGON — BLUE ═══ -->
    <polygon
      points="100,74 122,90 113,115 87,115 78,90"
      fill="#4d9eff" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- ═══ RING 1 HEXAGONS (white with colored border) ═══ -->
    <!-- H0 top -->
    <polygon
      points="100,20 121,32 121,57 100,69 79,57 79,32"
      fill="white" stroke="#3ecf6e" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- H1 top-right -->
    <polygon
      points="151,44 170,62 162,86 138,90 122,74 127,49"
      fill="white" stroke="#f5d547" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- H2 bottom-right -->
    <polygon
      points="162,118 155,143 132,150 113,135 117,110 142,104"
      fill="white" stroke="#4d9eff" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- H3 bottom-left -->
    <polygon
      points="88,110 83,135 60,143 38,118 48,104 73,110"
      fill="white" stroke="#f05a40" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- H4 top-left -->
    <polygon
      points="73,49 78,74 62,90 38,86 30,62 49,44"
      fill="white" stroke="#3ecf6e" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- ═══ RING 1 PENTAGONS (NEXO colors) ═══ -->
    <!-- P1 top-right — GREEN -->
    <polygon
      points="130,12 152,25 152,50 128,58 112,40"
      fill="#3ecf6e" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- P2 right — YELLOW -->
    <polygon
      points="176,72 185,98 170,120 148,112 148,87"
      fill="#f5d547" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- P3 bottom-right — RED -->
    <polygon
      points="148,152 130,175 106,172 96,150 117,137"
      fill="#f05a40" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- P4 bottom-left — BLUE -->
    <polygon
      points="83,150 104,172 80,175 52,152 52,137"
      fill="#4d9eff" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- P5 left — GREEN -->
    <polygon
      points="52,87 52,112 24,120 15,98 24,72"
      fill="#3ecf6e" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- ═══ OUTER PARTIAL PENTAGONS (ring 2, partially clipped) ═══ -->
    <!-- Top center — YELLOW -->
    <polygon
      points="82,2 100,-8 118,2 118,24 82,24"
      fill="#f5d547" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Top-right outer — RED -->
    <polygon
      points="158,8 178,28 170,50 150,38 148,14"
      fill="#f05a40" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Right outer — GREEN -->
    <polygon
      points="190,78 200,100 190,122 175,112 178,88"
      fill="#3ecf6e" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Bottom-right outer — YELLOW -->
    <polygon
      points="168,158 148,178 130,170 142,150 162,145"
      fill="#f5d547" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Bottom-left outer — BLUE -->
    <polygon
      points="70,170 52,178 32,158 38,145 58,150"
      fill="#4d9eff" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Left outer — RED -->
    <polygon
      points="10,78 22,88 25,112 10,122 0,100"
      fill="#f05a40" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Top-left outer — GREEN -->
    <polygon
      points="42,8 52,14 50,38 30,50 22,28"
      fill="#3ecf6e" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Bottom center outer — BLUE -->
    <polygon
      points="82,176 118,176 118,198 100,208 82,198"
      fill="#4d9eff" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Specular + shadow overlays -->
    <circle cx="100" cy="100" r="97" fill="url(#shine)"/>
    <circle cx="100" cy="100" r="97" fill="url(#shadow)"/>

  </g>

  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

</svg>
</div>

</body>
</html>
